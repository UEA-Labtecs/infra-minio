version: '3.9'

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    # Portas expostas para a rede local
    # O acesso externo é via Nginx Proxy Manager (NPM)
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console Web

    environment:
      # Credenciais (alinhadas com api-sgpi)
      # MINIO_ROOT_USER = MINIO_ACCESS_KEY (usado pela api-sgpi)
      # MINIO_ROOT_PASSWORD = MINIO_SECRET_KEY (usado pela api-sgpi)
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

      # URLs públicas (configuradas via NPM)
      MINIO_SERVER_URL: http://api-minio.labtecs.com.br
      MINIO_BROWSER_REDIRECT_URL: http://minio.labtecs.com.br

      # Região
      MINIO_REGION_NAME: us-east-1

    volumes:
      # Dados persistentes
      - ./data:/data

    command: server /data --console-address ":9001"

    networks:
      - nginx_proxy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

    labels:
      # Labels para identificação
      - "com.labtecs.app=minio"
      - "com.labtecs.environment=production"
      - "com.labtecs.managed-by=github-actions"

networks:
  nginx_proxy:
    external: true
